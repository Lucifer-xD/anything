name: Nimbus iOS

# Builds and tests the Nimbus VPN iOS project under ios/.
#   • core-tests : runs the 65 NimbusKit unit tests on Linux (no Xcode needed).
#   • app-build  : generates the Xcode project and compiles the app + extension
#                  for the simulator (unsigned) — this is where SwiftUI actually
#                  compiles, so it verifies the whole UI.
#   • release-ipa: OPTIONAL. Archives and exports a signed .ipa. Runs only when
#                  the Apple signing secrets below are present in the repo.
#
# To produce a signed .ipa, add these repository secrets (Settings → Secrets):
#   APPLE_TEAM_ID                 your 10-char Team ID
#   BUILD_CERTIFICATE_BASE64      base64 of your Apple Distribution .p12
#   P12_PASSWORD                  password for that .p12
#   APP_PROVISION_BASE64          base64 of the app .mobileprovision
#   TUNNEL_PROVISION_BASE64       base64 of the extension .mobileprovision
#   KEYCHAIN_PASSWORD             any random string (temp keychain password)
# and set the two PROVISIONING_PROFILE_SPECIFIER values in ExportOptions.plist.

on:
  push:
    branches: [ "claude/nimbus-vpn-ios-x37uzv", "main" ]
    paths: [ "ios/**", ".github/workflows/ios-nimbus-build.yml" ]
  pull_request:
    paths: [ "ios/**" ]
  workflow_dispatch:

jobs:
  core-tests:
    name: NimbusKit core (swift test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: swift-actions/setup-swift@v2
        with:
          swift-version: "6.1"
      - name: swift test
        working-directory: ios
        run: swift test

  app-build:
    name: App + Extension (simulator, unsigned)
    runs-on: macos-14
    needs: core-tests
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        working-directory: ios
        run: xcodegen generate
      - name: Build for simulator
        working-directory: ios
        run: |
          set -o pipefail
          xcodebuild \
            -project NimbusVPN.xcodeproj \
            -scheme NimbusVPN \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            build

  free-ipa:
    name: Unsigned .ipa (for AltStore/Sideloadly)
    runs-on: macos-14
    needs: core-tests
    # Builds the no-extension free variant for a real device WITHOUT signing, then
    # packages an unsigned .ipa. You then sign+install it on your iPhone with a
    # free Apple ID using Sideloadly/AltStore on Windows — no Mac, no $99 needed.
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate free-variant project
        working-directory: ios
        run: xcodegen generate --spec project-free.yml
      - name: Build unsigned (device)
        working-directory: ios
        run: |
          set -o pipefail
          xcodebuild \
            -project NimbusVPN.xcodeproj \
            -scheme NimbusVPN \
            -sdk iphoneos \
            -configuration Release \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build
      - name: Package .ipa
        working-directory: ios
        run: |
          set -euo pipefail
          APP=$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' | head -1)
          echo "Packaging $APP"
          rm -rf Payload && mkdir Payload
          cp -R "$APP" Payload/
          zip -qry NimbusVPN-unsigned.ipa Payload
          ls -lh NimbusVPN-unsigned.ipa
      - name: Upload unsigned .ipa
        uses: actions/upload-artifact@v4
        with:
          name: NimbusVPN-unsigned-ipa
          path: ios/NimbusVPN-unsigned.ipa
          if-no-files-found: error

  release-ipa:
    name: Signed .ipa (opt-in)
    runs-on: macos-14
    needs: app-build
    if: ${{ github.event_name == 'workflow_dispatch' }}
    steps:
      - uses: actions/checkout@v4
      - name: Guard — require signing secrets
        id: guard
        env:
          CERT: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
        run: |
          if [ -z "$CERT" ]; then
            echo "No signing secrets configured — skipping signed export."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Install XcodeGen
        if: steps.guard.outputs.ok == 'true'
        run: brew install xcodegen
      - name: Import signing assets
        if: steps.guard.outputs.ok == 'true'
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          APP_PROVISION_BASE64: ${{ secrets.APP_PROVISION_BASE64 }}
          TUNNEL_PROVISION_BASE64: ${{ secrets.TUNNEL_PROVISION_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail
          CERT_PATH="$RUNNER_TEMP/cert.p12"
          KEYCHAIN="$RUNNER_TEMP/app.keychain-db"
          echo "$BUILD_CERTIFICATE_BASE64" | base64 --decode > "$CERT_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$CERT_PATH" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security list-keychain -d user -s "$KEYCHAIN"
          PROFILES="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$PROFILES"
          echo "$APP_PROVISION_BASE64" | base64 --decode > "$PROFILES/app.mobileprovision"
          echo "$TUNNEL_PROVISION_BASE64" | base64 --decode > "$PROFILES/tunnel.mobileprovision"
      - name: Generate project
        if: steps.guard.outputs.ok == 'true'
        working-directory: ios
        run: xcodegen generate
      - name: Archive
        if: steps.guard.outputs.ok == 'true'
        working-directory: ios
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -o pipefail
          xcodebuild \
            -project NimbusVPN.xcodeproj \
            -scheme NimbusVPN \
            -sdk iphoneos \
            -configuration Release \
            -archivePath "$RUNNER_TEMP/Nimbus.xcarchive" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            archive
      - name: Export .ipa
        if: steps.guard.outputs.ok == 'true'
        working-directory: ios
        run: |
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/Nimbus.xcarchive" \
            -exportOptionsPlist ExportOptions.plist \
            -exportPath "$RUNNER_TEMP/export"
      - name: Upload .ipa artifact
        if: steps.guard.outputs.ok == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: NimbusVPN-ipa
          path: ${{ runner.temp }}/export/*.ipa
          if-no-files-found: error
